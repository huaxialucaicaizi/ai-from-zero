<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>加班费估算器 · 虚构示例</title>
  <style>
    :root {
      --bg: #eef6f3;
      --ink: #14211d;
      --accent: #b45309;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(160deg, #dbece6 0%, var(--bg) 45%, #f8f1e7 100%);
      min-height: 100vh;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      padding: 40px 18px 64px;
    }
    .note {
      font-size: 12px;
      color: #57534e;
      margin-bottom: 10px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.8rem;
    }
    p { line-height: 1.6; }
    form {
      margin-top: 24px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid rgba(20, 33, 29, 0.1);
      display: grid;
      gap: 14px;
    }
    label { display: grid; gap: 6px; font-size: 0.95rem; }
    input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #cbd5d1;
      border-radius: 0;
      background: #fff;
    }
    button {
      font: inherit;
      padding: 12px 14px;
      border: 0;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #result {
      margin-top: 18px;
      padding: 14px 16px;
      background: #fff7ed;
      border-left: 4px solid var(--accent);
      min-height: 3em;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="note">虚构示例 · 仅供练习，不构成工资或法律意见</p>
    <h1>加班费粗算</h1>
    <p>输入时薪和加班小时，立刻看到估算结果。规则可按你公司制度再改。</p>

    <form id="form">
      <label>
        时薪（元）
        <input id="rate" type="number" min="0" step="0.01" value="50" required />
      </label>
      <label>
        加班小时
        <input id="hours" type="number" min="0" step="0.5" value="3" required />
      </label>
      <label>
        倍率（例如 1.5）
        <input id="factor" type="number" min="0" step="0.1" value="1.5" required />
      </label>
      <button type="submit">算一下</button>
    </form>

    <div id="result" aria-live="polite">填写数字后点「算一下」。</div>
  </main>
  <script>
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const rate = Number(document.getElementById("rate").value);
      const hours = Number(document.getElementById("hours").value);
      const factor = Number(document.getElementById("factor").value);
      if ([rate, hours, factor].some((n) => Number.isNaN(n))) {
        result.textContent = "请填写有效数字。";
        return;
      }
      const total = rate * hours * factor;
      result.textContent =
        "估算加班费约 " + total.toFixed(2) + " 元（时薪 × 小时 × 倍率）。以公司制度为准。";
    });
  </script>
</body>
</html>
